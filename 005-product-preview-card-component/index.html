<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <main>
    <picture>
      <source media="(min-width: 40rem)" srcset="images/image-product-desktop.jpg" type="image/jpg">
      <img src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum bottle" class="image-product-perfume">
    </picture>
    <section class="card-body">
      <p class="category">Perfume</p>
      <h1>Gabrielle Essence Eau De Parfum</h1>
      <p class="txt">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>
      <div class="prices">
        <span class="current-price">$149.99</span>
        <s>$169.99</s>
      </div>
      <button type="button" class="btn-add">
        <img src="images/icon-cart.svg" alt="icon cart">
        Add to Cart
      </button>
    </section>
  </main>
</body>
</html>
