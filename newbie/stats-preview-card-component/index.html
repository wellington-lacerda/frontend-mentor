<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Stats preview card component</title>
</head>
<body>
  <main class="card-main">
    <div class="card-img-box">
      <picture>
        <source media="(min-width: 40rem)" srcset="images/image-header-desktop.jpg" type="image/jpg"> 
        <img src="images/image-header-mobile.jpg" alt="image of a group of researchers" class="image-illustration">
      </picture>
    </div>
    <section class="card-body">
      <h1>Get <span>insights</span> that help your business grow.</h1>
      <p class="lead">
        Discover the benefits of data analytics and make better decisions regarding revenue, customer 
        experience, and overall efficiency.
      </p>
      <div class="stats">
        <div class="stats__item">
          <span class="stats__number">10k+</span>
          <span class="stats__label">companies</span>
        </div>
        <div class="stats__item">
          <span class="stats__number">314</span>
          <span class="stats__label">templates</span>
        </div>
        <div class="stats__item">
          <span class="stats__number">12M+</span>
          <span class="stats__label">queries</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
