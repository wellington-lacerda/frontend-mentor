<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Order summary card</title>
</head>
<body>
  <main class="card">
    <img src="images/illustration-hero.svg" alt="illustration listen songs audiobooks" class="illustration-hero">
    <section class="card-body">
      <h1>Order Summary</h1>
      <p class="lead">
        You can now listen to millions of songs, audiobooks, and podcasts on any 
        device anywhere you like!
      </p>
      <div class="flex-row card-plan">
        <div class="flex-row">
          <img src="images/icon-music.svg" alt="music icon">
          <div class="flex-column">
            <span class="text-primary">Annual Plan</span>
            <span class="text-secondary">$59.99/year</span>
          </div>
        </div>
        <a href="#" class="">Change</a>
      </div>
      <button type="button" class="btn btn-payment">
        Proceed to Payment
      </button>
      <button type="button" class="btn btn-cancel">
        Cancel Order
      </button>
    </section>
  </main>
</body>
</html>
