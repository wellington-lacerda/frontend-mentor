<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
  <main>
    <div class="card-img">
      <img src="images/image-equilibrium.jpg" alt="Equilibrium image" class="equilibrium">
    </div>
    <section class="card-body">
      <h1>Equilibrium #3429</h1>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      
      <div class="text-info flex-row">
        <div class="ethereum flex-row">
          <img src="images/icon-ethereum.svg" alt="icon ethereum">
          <span>0.041 ETH</span>
        </div>
        <div class="clock flex-row">
          <img src="images/icon-clock.svg" alt="icon clock">
          <span>3 days left</span>
        </div>
      </div>
      
      <div class="card-perfil flex-row">
        <img src="images/image-avatar.png" alt="avatar of Jules Wyvern">
       <div class="text-name"> 
         <span>Creation of</span>
         <strong>Jules Wyvern</strong>
       </div>
      </div>
    </section>
  </main>
</body>
</html>
