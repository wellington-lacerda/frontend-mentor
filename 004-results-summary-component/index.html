<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/script.js"></script>
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <main>
    <section class="result">
      <h1>Your Result</h1>
      <div class="circle-result">
        <span class="score-result">76</span>
        <span class="tot-result">of 100</span>
      </div>
      <div class="card-info">
        <h2>Great</h2>
        <p class="txt-result">You scored higher than 65% of the people who have taken these tests.</p>
      </div>
    </section>
    <section class="container">
      <h2>Summary</h2>
      <div class="cards">
        <!-- Aqui ficará todos os cards -->
      </div>
      <button type="button" class="btn-continue">
        Continue
      </button>
    </section>
  </main>
</body>
</html>
